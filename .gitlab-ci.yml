# Fork-local pipeline. It was written for a GitLab 13.12 instance and runs
# unchanged on gitlab.com's shared runners (see docs/decisions/013).
#
# Upstream's .gitlab-ci.yml targets gitlab.com and cannot run on 13.12:
#   - Jobs/*.latest.gitlab-ci.yml security templates ship inside GitLab >= 14.x,
#     so 13.12 rejects the include and the pipeline dies before any job starts.
#   - include:project 'gitlab-org/quality/pipeline-common' does not exist here.
#   - default tags: [gitlab-org] matches no runner on this instance.
#
# What is kept: lint, unit tests, and the VSIX build - the three things that
# actually guard this fork. Security scanning, docs linting, commit linting,
# integration tests and Open VSX publishing are all dropped; they depend on
# gitlab.com infrastructure or on credentials this fork does not have.
#
# A release tag (vX.Y.Z, see scripts/release.mjs) also publishes the VSIX and
# its checksum to this project's generic package registry and creates a GitLab
# Release that links them (docs/decisions/005), and publishes the VSIX to the
# Visual Studio Marketplace as tranphucbol.review-for-gitlab (docs/decisions/015,
# docs/decisions/022).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

image: node:24-slim

stages:
  - test
  - package
  - publish

variables:
  PACKAGE_NAME: review-for-gitlab
  PACKAGE_REGISTRY_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}'

# git is needed by npm ci (git-backed dependencies) and by the lint job.
.node:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - npm ci

lint:
  stage: test
  extends: .node
  script:
    - cd webviews/vue && npm ci && cd ../.. # npm run lint recurses into the webviews
    - cd webviews/vue2 && npm ci && cd ../..
    # npm install rewrites package.json formatting; revert so prettier --check
    # sees the committed state rather than npm's version of it
    - git checkout .
    - npm run lint

test-unit:
  stage: test
  extends: .node
  script:
    - npm run test:unit -- --coverage
  artifacts:
    when: always
    reports:
      junit:
        - reports/unit.xml

package:
  stage: package
  extends: .node
  script:
    # a tag publishes the VSIX under its own name, so the two must agree
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION=$(node -p "require('./package.json').version")
        if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
          echo "ERROR: tag $CI_COMMIT_TAG does not match package.json version $VERSION"
          exit 1
        fi
      fi
    - npm run package
    - cd dist-desktop
    - for VSIX in *.vsix; do sha256sum "$VSIX" > "$VSIX.sha256"; done
    - sha256sum -c *.vsix.sha256
  artifacts:
    paths:
      - 'dist-desktop/*.vsix'
      - 'dist-desktop/*.vsix.sha256'
    expire_in: 1 year

# Generic packages are immutable, so a retried job accepts a file that is
# already there only when it is byte-for-byte this build's.
publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/'
  needs:
    - job: package
      artifacts: true
  variables:
    GIT_DEPTH: 0 # the release notes fall back to git log since the previous tag
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
  script:
    - set -eu
    - VERSION="${CI_COMMIT_TAG#v}"
    - VSIX_NAME="${PACKAGE_NAME}-${VERSION}.vsix"
    - VSIX_PATH="dist-desktop/${VSIX_NAME}"
    - |
      if [ ! -f "$VSIX_PATH" ]; then
        echo "ERROR: $VSIX_PATH was not built"
        ls dist-desktop
        exit 1
      fi
    - VSIX_URL="${PACKAGE_REGISTRY_URL}/${VERSION}/${VSIX_NAME}"
    - CHECKSUM_NAME="${VSIX_NAME}.sha256"
    - CHECKSUM_PATH="${VSIX_PATH}.sha256"
    - CHECKSUM_URL="${VSIX_URL}.sha256"
    - |
      upload() {
        FILE_PATH="$1"
        FILE_URL="$2"
        FILE_NAME=$(basename "$FILE_PATH")
        STATUS=$(curl --silent --show-error --location --retry 3 --retry-connrefused \
          --output remote-file --write-out '%{http_code}' \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$FILE_URL")
        if [ "$STATUS" = "200" ]; then
          cmp -s remote-file "$FILE_PATH" || {
            echo "ERROR: package file ${FILE_NAME} already exists and differs from this build"
            exit 1
          }
          echo "Package file ${FILE_NAME} already exists with the same content"
        elif [ "$STATUS" = "404" ]; then
          echo "Uploading ${FILE_NAME} to the generic package registry"
          curl --fail --silent --show-error --retry 3 --retry-connrefused \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "$FILE_PATH" "$FILE_URL" > /dev/null
        else
          echo "ERROR: package lookup for ${FILE_NAME} returned HTTP ${STATUS}"
          exit 1
        fi
        rm -f remote-file
      }
      upload "$VSIX_PATH" "$VSIX_URL"
      upload "$CHECKSUM_PATH" "$CHECKSUM_URL"
    - |
      PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${CI_COMMIT_TAG}^" 2>/dev/null || true)
      if [ -n "$PREV_TAG" ]; then
        git log --no-merges --pretty='* %s' "${PREV_TAG}..${CI_COMMIT_TAG}" > git-log-notes.txt
      else
        git log --no-merges --pretty='* %s' "${CI_COMMIT_TAG}" > git-log-notes.txt
      fi
    # The CHANGELOG.md entry is the fork release's notes (AGENTS.md: a fork
    # release says it is one); git log covers a tag cut without one.
    - |
      VERSION="$VERSION" VSIX_NAME="$VSIX_NAME" VSIX_URL="$VSIX_URL" CHECKSUM_NAME="$CHECKSUM_NAME" CHECKSUM_URL="$CHECKSUM_URL" node -e '
        const fs = require("fs");
        const env = process.env;
        const escaped = env.VERSION.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
        const start = lines.findIndex(line => new RegExp(`^#{1,2} \\[${escaped}\\]`).test(line));
        let notes = "";
        if (start >= 0) {
          const rest = lines.slice(start + 1);
          const end = rest.findIndex(line => /^#{1,2} \[?\d/.test(line));
          notes = (end >= 0 ? rest.slice(0, end) : rest).join("\n").trim();
        } else {
          console.log(`CHANGELOG.md has no entry for ${env.VERSION}; using git log`);
        }
        notes = notes || fs.readFileSync("git-log-notes.txt", "utf8").trim() || "* no changes recorded";
        const install = [
          "### Install",
          "",
          "Export a `GITLAB_TOKEN` with API read access to this project, then:",
          "",
          "```sh",
          `curl --fail --location --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --remote-name "${env.VSIX_URL}"`,
          `curl --fail --location --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --remote-name "${env.CHECKSUM_URL}"`,
          `shasum -a 256 -c ${env.CHECKSUM_NAME}`,
          `code --install-extension ${env.VSIX_NAME} --force`,
          "```",
          "",
          "Then run **Developer: Reload Window** in VS Code.",
        ];
        const body = {
          name: env.CI_COMMIT_TAG,
          tag_name: env.CI_COMMIT_TAG,
          description: [notes, "", ...install].join("\n"),
          assets: {
            links: [
              { name: env.VSIX_NAME, url: env.VSIX_URL, link_type: "package" },
              { name: env.CHECKSUM_NAME, url: env.CHECKSUM_URL, link_type: "package" },
            ],
          },
        };
        fs.writeFileSync("release.json", JSON.stringify(body));
      '
    - |
      # GitLab 13.12 answers 403, not 404, for a release that does not exist,
      # so look the tag up in the list instead.
      RELEASES_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      curl --fail --silent --show-error --retry 3 --retry-connrefused \
        --output releases.json \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${RELEASES_URL}?per_page=100"
      if node -e '
        var releases = require("./releases.json");
        process.exit(releases.some(function (release) {
          return release.tag_name === process.env.CI_COMMIT_TAG;
        }) ? 0 : 1);
      '; then
        echo "Release ${CI_COMMIT_TAG} already exists; not creating it again"
      else
        echo "Creating release ${CI_COMMIT_TAG}"
        curl --fail --silent --show-error --retry 3 --retry-connrefused \
          --request POST \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data @release.json \
          "$RELEASES_URL" > /dev/null
      fi
    - 'echo "Done: ${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"'

# The Marketplace accepts only X.Y.Z, so a prerelease tag stops at the package
# registry. There is no stored secret: the job signs in to Azure as a managed
# identity that trusts this project's protected tags. See docs/decisions/015.
publish-marketplace:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
  needs:
    - job: package
      artifacts: true
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - set -eu
    - VSIX_PATH="dist-desktop/${PACKAGE_NAME}-${CI_COMMIT_TAG#v}.vsix"
    # AZURE_CLIENT_ID and AZURE_TENANT_ID are protected project variables
    - printf '%s' "$AZURE_ID_TOKEN" > "${CI_PROJECT_DIR}/.azure-id-token"
    - export AZURE_FEDERATED_TOKEN_FILE="${CI_PROJECT_DIR}/.azure-id-token"
    - npx --yes @vscode/vsce@3 publish --azure-credential --packagePath "$VSIX_PATH" --skip-duplicate
