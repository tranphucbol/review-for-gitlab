# Fork-local pipeline for a GitLab 13.12 instance.
#
# Upstream's .gitlab-ci.yml targets gitlab.com and cannot run on this instance:
#   - Jobs/*.latest.gitlab-ci.yml security templates ship inside GitLab >= 14.x,
#     so 13.12 rejects the include and the pipeline dies before any job starts.
#   - include:project 'gitlab-org/quality/pipeline-common' does not exist here.
#   - default tags: [gitlab-org] matches no runner on this instance.
#
# What is kept: lint, unit tests, and the VSIX build - the three things that
# actually guard this fork. Security scanning, docs linting, commit linting,
# integration tests and Marketplace publishing are all dropped; they depend on
# gitlab.com infrastructure or on credentials this fork does not have.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

image: node:18-slim

stages:
  - test
  - package

# git is needed by npm ci (git-backed dependencies) and by the lint job.
.node:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - npm ci

lint:
  stage: test
  extends: .node
  script:
    - cd webviews/vue && npm ci && cd ../.. # npm run lint recurses into the webviews
    - cd webviews/vue2 && npm ci && cd ../..
    # npm install rewrites package.json formatting; revert so prettier --check
    # sees the committed state rather than npm's version of it
    - git checkout .
    - npm run lint

test-unit:
  stage: test
  extends: .node
  script:
    - npm run test:unit -- --coverage
  artifacts:
    when: always
    reports:
      junit:
        - reports/unit.xml

package:
  stage: package
  extends: .node
  script:
    - npm run package
  artifacts:
    paths:
      - 'dist-desktop/*.vsix'
    expire_in: 1 year
